version = 1

[[apps]]
name = "research-analyst-symbol-rotation"
command = "/home/ubuntu/research-analyst/venv/bin/python src/research_analyst/symbol_rotation.py"
cwd = "/home/ubuntu/research-analyst"
env = { PYTHONPATH = "/home/ubuntu/research-analyst/src/research_analyst", PYTHONUNBUFFERED = "1" }
restart_policy = "always"
max_restarts = 20
crash_restart_limit = 3
stop_timeout_secs = 5
health_cmd = "/home/ubuntu/research-analyst/venv/bin/python /home/ubuntu/research-analyst/scripts/symbol_rotation_healthcheck.py"
health_interval_secs = 30
health_timeout_secs = 5
health_max_failures = 3

