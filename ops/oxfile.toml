name = "research-analyst-ws"
command = "/home/ubuntu/research-analyst/venv/bin/python src/research_analyst/ws_gateway.py"
cwd = "/home/ubuntu/research-analyst"
env = { PYTHONPATH = "/home/ubuntu/research-analyst/src/research_analyst", PYTHONUNBUFFERED = "1" }
restart_policy = "always"
max_restarts = 20
crash_restart_limit = 3
stop_timeout_secs = 30

